[package]
name = "vgv"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "vgv"
path = "src/cli.rs"

[dependencies]
anyhow = "1.0.101"
base64 = "0.22.1"
diff-match-patch-rs = "0.5.1"
pico-args = "0.5.0"
resvg = "0.47.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tiny-skia = "0.12.0"
usvg = "0.46.0"
